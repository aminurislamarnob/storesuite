# Runs on every pull request, and additionally on direct pushes to the
# release-critical branches so merges get a run even without a PR event.
on:
    pull_request:
    push:
        branches:
            - develop
            - feat/dark-light-mode

name: Tests
jobs:
    runPHPUnit:
        name: Run PHPUnit
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: wordpress_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.1'
                  extensions: mysqli
                  coverage: none
                  tools: composer:v2

            - name: Get composer cache directory
              id: composercache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composercache.outputs.dir }}
                  key: "${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}"
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Download WordPress core
              run: curl -sL https://wordpress.org/latest.tar.gz | tar -xz -C /tmp

            - name: Download WooCommerce
              run: |
                  curl -sL https://downloads.wordpress.org/plugin/woocommerce.latest-stable.zip -o /tmp/woocommerce.zip
                  unzip -q /tmp/woocommerce.zip -d /tmp/wordpress/wp-content/plugins

            # The suite (and StoreSuite's own URL/path helpers) assume the plugin
            # lives under wp-content/plugins like a real install, next to WooCommerce.
            - name: Install the plugin into the WordPress plugins directory
              run: rsync -a --exclude .git ./ /tmp/wordpress/wp-content/plugins/storesuite/

            - name: Run PHPUnit
              working-directory: /tmp/wordpress/wp-content/plugins/storesuite
              env:
                  WP_TESTS_DB_NAME: wordpress_test
                  WP_TESTS_DB_USER: root
                  WP_TESTS_DB_PASSWORD: root
                  WP_TESTS_DB_HOST: 127.0.0.1:3306
              run: vendor/bin/phpunit
